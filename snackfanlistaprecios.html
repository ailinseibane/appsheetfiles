<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Precios · Snack Fan</title>
  <style>
    :root {
      --bordo: #800020;
      --bordo-claro: #f7d9df;
      --verde: #1f7a1f;
      --gris: #666;
      --fondo: #f4f0f2;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: var(--fondo);
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .logo img { height: 80px; display: block; }

    .contact-minidata {
      font-size: 14px;
      color: var(--gris);
      text-align: right;
      line-height: 1.7;
    }

    .contact-minidata a {
      color: var(--gris);
      text-decoration: none;
      display: block;
    }

    .header h1 {
      text-align: center;
      color: var(--bordo);
      font-size: 28px;
      text-transform: uppercase;
      margin: 10px 0 16px;
    }

    /* ---- Barra de búsqueda + categorías (queda fija arriba) ---- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: white;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .search {
      width: 100%;
      font-size: 16px; /* 16px evita que iPhone haga zoom al tocar */
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
    }

    .search:focus { border-color: var(--bordo); }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--bordo);
      background: white;
      color: var(--bordo);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip:active { background: var(--bordo-claro); }

    /* ---- Categorías y productos ---- */
    .category {
      margin-top: 28px;
      scroll-margin-top: 120px; /* para que el título no quede tapado por la barra fija */
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bordo-claro);
      padding: 10px 15px;
      border-left: 6px solid var(--bordo);
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .category-header h2 {
      color: var(--bordo);
      font-size: 20px;
      margin: 0;
    }

    .category-header img { height: 36px; }

    .product {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 14px 0;
      gap: 18px;
      page-break-inside: avoid;
    }

    .product img {
      flex: 0 0 auto;
      height: 90px;
      width: 90px;
      object-fit: contain;
      border-radius: 10px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      cursor: zoom-in;
    }

    .product-info { flex-grow: 1; min-width: 0; }

    .product-name {
      font-weight: 600;
      font-size: 16px;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .product-description {
      font-size: 14px;
      color: var(--gris);
      margin-bottom: 4px;
    }

    .product-price {
      color: var(--verde);
      font-size: 19px;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--gris);
      padding: 30px 0;
      display: none;
    }

    .loading {
      text-align: center;
      color: var(--gris);
      padding: 40px 0;
    }

    /* ---- Lightbox (imagen ampliada) ---- */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 92vw;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 10px;
      background: white;
    }

    .lightbox-caption {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 17px;
      font-weight: 600;
      padding: 0 20px;
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: var(--bordo);
      color: white;
      font-size: 28px;
      line-height: 48px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: #25D366;
      border-radius: 50%;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .whatsapp-float img { width: 44px; height: 44px; display: block; }

    /* ---- Celular ---- */
    @media (max-width: 600px) {
      body { padding: 0; }

      .container {
        border-radius: 0;
        box-shadow: none;
        padding: 14px 14px 90px; /* espacio abajo para el botón de WhatsApp */
      }

      .logo img { height: 60px; }
      .contact-minidata { font-size: 13px; }

      .header h1 { font-size: 21px; }

      .category-header h2 { font-size: 18px; }
      .category-header img { height: 30px; }

      .product { gap: 14px; padding: 12px 0; }
      .product img { width: 80px; height: 80px; }
      .product-name { font-size: 15px; }
      .product-price { font-size: 18px; }

      .whatsapp-float { bottom: 16px; right: 16px; }
    }

    /* ---- Impresión ---- */
    @media print {
      body { margin: 0; padding: 0; background: white; }
      .container { box-shadow: none; border-radius: 0; padding: 20px; }
      .whatsapp-float, .lightbox, .toolbar { display: none !important; }
      .category { page-break-inside: avoid; }
    }
  </style>
</head>

<body>
  <a href="https://wa.me/5492364316825" class="whatsapp-float" target="_blank" aria-label="Contactar por WhatsApp">
    <img src="https://cdn-icons-png.flaticon.com/512/220/220236.png" alt="WhatsApp" />
  </a>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Imagen ampliada">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Cerrar">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <div class="container">
    <div class="topbar">
      <div class="logo">
        <img src="https://acdn-us.mitiendanube.com/stores/005/821/939/themes/common/logo-1951200950-1739356298-6be1913107e967b9582522cb6ccf771a1739356298.png?0" alt="Snack Fan">
      </div>
      <div class="contact-minidata">
        <a href="https://wa.me/5492364316825" target="_blank">📞 236 4316825</a>
        <a href="https://instagram.com/snackfanjunin" target="_blank">📸 @snackfanjunin</a>
      </div>
    </div>

    <div class="header">
      <h1>Lista de precios <span id="Tipo"></span></h1>
    </div>

    <div class="toolbar">
      <input id="buscador" class="search" type="search" placeholder="🔍 Buscar producto..." autocomplete="off">
      <div id="chips" class="chips"></div>
    </div>

    <div id="contenido"><div class="loading">Cargando precios…</div></div>
    <div id="sinResultados" class="empty">No se encontraron productos.</div>
  </div>

  <script>
  // ================== CONFIGURACIÓN DE ESTA LISTA ==================
  // Cada lista (minorista / mayorista) es un archivo aparte con su propio CSV.
  // El CSV ya trae el precio FINAL: no hay costos ni porcentajes en la página.
  const TIPO = "MAYORISTA";
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQZsx6ZE1gGg6vWsLWLjpUEDTfJxPa9ZYYjtlLT85N0OL-T3J0Q1LW8c0CBpufS3RXLRhWfH2lZTutU/pub?gid=1314104074&single=true&output=csv";
  // ==================================================================

  document.getElementById("Tipo").innerText = TIPO;

  const logoURL = "https://acdn-us.mitiendanube.com/stores/005/821/939/themes/common/logo-1951200950-1739356298-6be1913107e967b9582522cb6ccf771a1739356298.png?0";
  const sinFoto = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><rect width="90" height="90" fill="#f2f2f2"/><text x="45" y="50" font-family="sans-serif" font-size="11" fill="#999" text-anchor="middle">Sin foto</text></svg>');

  function getImageUrl(filename) {
    if (!filename) return sinFoto;
    return `https://www.appsheet.com/template/gettablefileurl?appName=Gestionstock-5955407&tableName=items&fileName=${encodeURIComponent(filename)}`;
  }

  // Parser de CSV que respeta comillas (nombres con comas, precios "1.525,70", etc.)
  function parseCSV(texto) {
    const filas = [];
    let fila = [], campo = "", enComillas = false;
    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (enComillas) {
        if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
        else if (c === '"') enComillas = false;
        else campo += c;
      } else if (c === '"') enComillas = true;
      else if (c === ",") { fila.push(campo); campo = ""; }
      else if (c === "\n") { fila.push(campo); filas.push(fila); fila = []; campo = ""; }
      else if (c !== "\r") campo += c;
    }
    if (campo || fila.length) { fila.push(campo); filas.push(fila); }
    return filas.filter(f => f.some(v => v.trim() !== ""));
  }

  // Acepta "1.525,70", "1525,70", "1525.70" o "$ 1.525"
  function parsePrecio(valor) {
    if (!valor) return 0;
    let v = valor.replace(/[^0-9.,-]/g, "");
    if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");      // "1.525,70" → 1525.70
    else if (/^-?\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, "");  // "1.525" → 1525 (punto de miles)
    return parseFloat(v) || 0;
  }

  function escapar(texto) {
    return String(texto ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Formato argentino: $1.525,70
  const formatoPrecio = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function slug(texto) {
    return "cat-" + texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-");
  }

  // ---- Lightbox ----
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxCaption = document.getElementById("lightboxCaption");

  function abrirLightbox(src, nombre) {
    lightboxImg.src = src;
    lightboxImg.alt = nombre;
    lightboxCaption.textContent = nombre;
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function cerrarLightbox() {
    lightbox.classList.remove("open");
    lightboxImg.src = "";
    document.body.style.overflow = "";
  }

  document.getElementById("lightboxClose").addEventListener("click", cerrarLightbox);
  lightbox.addEventListener("click", e => { if (e.target === lightbox) cerrarLightbox(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && lightbox.classList.contains("open")) cerrarLightbox();
  });

  document.getElementById("contenido").addEventListener("click", e => {
    const img = e.target.closest(".product img");
    if (img) abrirLightbox(img.src, img.alt);
  });

  // ---- Buscador ----
  document.getElementById("buscador").addEventListener("input", e => {
    const q = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    let visibles = 0;

    document.querySelectorAll(".category").forEach(cat => {
      let enCategoria = 0;
      cat.querySelectorAll(".product").forEach(prod => {
        const coincide = !q || prod.dataset.busqueda.includes(q);
        prod.style.display = coincide ? "" : "none";
        if (coincide) enCategoria++;
      });
      cat.style.display = enCategoria ? "" : "none";
      visibles += enCategoria;
    });

    document.getElementById("sinResultados").style.display = visibles ? "none" : "block";
  });

  // ---- Carga de datos ----
  fetch(CSV_URL)
    .then(response => {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.text();
    })
    .then(csv => {
      const filas = parseCSV(csv);
      // Se leen las columnas por nombre de encabezado, así el orden en la planilla no importa
      const norm = t => t.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      const enc = filas[0].map(norm);
      // Acepta varios nombres posibles para cada columna
      const col = (...nombres) => enc.findIndex(h => nombres.includes(h));
      const iNombre = col("nombre", "producto"),
            iDesc   = col("descripcion", "desc"),
            iImg    = col("imagen", "foto"),
            iCat    = col("categoria", "cat"),
            iPrecio = col("precio", "precio final");

      const productos = filas.slice(1)
        .map(f => ({
          nombre: (f[iNombre] || "").trim(),
          descripcion: iDesc >= 0 ? (f[iDesc] || "").trim() : "",
          imagen: iImg >= 0 ? (f[iImg] || "").trim() : "",
          categoria: (f[iCat] || "").trim() || "Otros",
          precio: parsePrecio(f[iPrecio])
        }))
        .filter(p => p.nombre && p.precio > 0); // oculta filas vacías o sin precio

      const grupo = {};
      productos.forEach(p => {
        if (!grupo[p.categoria]) grupo[p.categoria] = [];
        grupo[p.categoria].push(p);
      });

      const contenido = document.getElementById("contenido");
      const chips = document.getElementById("chips");
      contenido.innerHTML = "";

      for (const categoria in grupo) {
        const id = slug(categoria);

        // Chip para saltar a la categoría
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = categoria;
        chip.addEventListener("click", () => {
          document.getElementById(id).scrollIntoView({ behavior: "smooth" });
        });
        chips.appendChild(chip);

        const bloque = document.createElement("div");
        bloque.className = "category";
        bloque.id = id;

        let html = `
          <div class="category-header">
            <h2>${escapar(categoria)}</h2>
            <img src="${logoURL}" alt="">
          </div>`;

        grupo[categoria].forEach(p => {
          const busqueda = `${p.nombre} ${p.descripcion} ${categoria}`
            .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          html += `
            <div class="product" data-busqueda="${escapar(busqueda)}">
              <img src="${escapar(getImageUrl(p.imagen))}" alt="${escapar(p.nombre)}" loading="lazy" onerror="this.onerror=null;this.src=sinFoto">
              <div class="product-info">
                <div class="product-name">${escapar(p.nombre)}</div>
                ${p.descripcion ? `<div class="product-description">${escapar(p.descripcion)}</div>` : ""}
                <div class="product-price">$${formatoPrecio.format(p.precio)}</div>
              </div>
            </div>`;
        });

        bloque.innerHTML = html;
        contenido.appendChild(bloque);
      }
    })
    .catch(() => {
      document.getElementById("contenido").innerHTML = '<div class="loading">No se pudieron cargar los precios. Probá recargar la página.</div>';
    });
  </script>
</body>
</html>
